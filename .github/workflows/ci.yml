name: CI
# Lint, test and build with the same single-command targets every agent uses locally.
# On failure, the selected agent triages the log read-only and posts a short summary (judgment step).
# Enable with the repository variable SDLC_ENABLED=true once the Makefile is configured.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: vars.SDLC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # - uses: actions/setup-node@v4 / setup-python / setup-java ... for your stack
      - run: mkdir -p out
      - name: Lint
        run: make lint 2>&1 | tee -a out/build.log
      - name: Test
        run: make test 2>&1 | tee -a out/build.log
      - name: Build
        run: make build 2>&1 | tee -a out/build.log

      # Triage only trusted main-branch code; never execute PR scripts with provider secrets.
      - name: Set up triage adapter
        if: failure() && github.event_name == 'push' && vars.SDLC_AGENT_ADAPTER != ''
        uses: ./.github/actions/setup-agent
        with:
          adapter: ${{ vars.SDLC_AGENT_ADAPTER }}
          version: ${{ vars.SDLC_AGENT_VERSION }}
      - name: Triage failed build (read-only)
        if: failure() && github.event_name == 'push' && vars.SDLC_AGENT_ADAPTER != ''
        env:
          SDLC_AGENT_ADAPTER: ${{ vars.SDLC_AGENT_ADAPTER }}
          SDLC_AGENT_COMMAND: ${{ vars.SDLC_AGENT_COMMAND }}
          SDLC_HARNESS_MODE_COMMANDS: ${{ vars.SDLC_HARNESS_MODE_COMMANDS }}
          SDLC_AGENT_MODES: ${{ vars.SDLC_AGENT_MODES }}
          SDLC_AGENT_TOKEN: ${{ vars.SDLC_AGENT_ADAPTER == 'command' && secrets.SDLC_AGENT_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ vars.SDLC_AGENT_ADAPTER == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ vars.SDLC_AGENT_ADAPTER == 'codex' && secrets.OPENAI_API_KEY || '' }}
        run: |
          cat > out/triage-prompt.md <<'PROMPT'
          Read out/build.log. Identify the most likely failure, whether it is flaky or a regression,
          and cite files/lines where possible. Output at most five lines of Markdown. Do not modify files.
          PROMPT
          python3 scripts/agent_run.py --prompt-file out/triage-prompt.md --mode read-only --output out/triage.json --text > triage.md
          { echo '### Build triage'; cat triage.md; } >> "$GITHUB_STEP_SUMMARY"

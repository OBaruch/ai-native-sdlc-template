name: Agent evals
# Regression suite for the agent's configuration. Runs when anything that steers the agent
# changes (AGENTS.md, skills, hooks, roles, adapters, commands, evals) and nightly.
# Make this a required status check so a pass-rate drop blocks the merge.

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/**"
      - "scripts/**"
      - ".github/actions/**"
      - ".github/workflows/agent-evals.yml"
      - ".claude/**"
      - "evals/**"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Trusted ref approved by a maintainer for credentialed evaluation"
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  evals:
    if: vars.SDLC_ENABLED == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-agent
        with:
          adapter: ${{ vars.SDLC_AGENT_ADAPTER }}
          version: ${{ vars.SDLC_AGENT_VERSION }}
      - name: Run eval suite
        env:
          SDLC_AGENT_ADAPTER: ${{ vars.SDLC_AGENT_ADAPTER }}
          SDLC_AGENT_COMMAND: ${{ vars.SDLC_AGENT_COMMAND }}
          SDLC_HARNESS_MODE_COMMANDS: ${{ vars.SDLC_HARNESS_MODE_COMMANDS }}
          SDLC_AGENT_MODES: ${{ vars.SDLC_AGENT_MODES }}
          SDLC_AGENT_TOKEN: ${{ vars.SDLC_AGENT_ADAPTER == 'command' && secrets.SDLC_AGENT_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ vars.SDLC_AGENT_ADAPTER == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ vars.SDLC_AGENT_ADAPTER == 'codex' && secrets.OPENAI_API_KEY || '' }}
          EVAL_PASS_THRESHOLD: ${{ vars.EVAL_PASS_THRESHOLD || '0.9' }}
        run: bash evals/run.sh --require-enabled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/.runs/
          if-no-files-found: ignore

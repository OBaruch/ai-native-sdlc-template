name: Intent to spec
# The selected agent drafts; a human approves. Only trusted main code sees credentials.
on:
  push:
    branches: [main]
    paths: ['intent/*/intent.md']
  workflow_dispatch:
    inputs:
      change:
        description: 'Change folder, e.g. intent/0007-claims-status'
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  spec:
    if: vars.SDLC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 2
      - uses: ./.github/actions/setup-agent
        with:
          adapter: ${{ vars.SDLC_AGENT_ADAPTER }}
          version: ${{ vars.SDLC_AGENT_VERSION }}
      - name: Draft specs and open review PRs
        env:
          CHANGE: ${{ inputs.change }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_AGENT_ADAPTER: ${{ vars.SDLC_AGENT_ADAPTER }}
          SDLC_AGENT_COMMAND: ${{ vars.SDLC_AGENT_COMMAND }}
          SDLC_HARNESS_MODE_COMMANDS: ${{ vars.SDLC_HARNESS_MODE_COMMANDS }}
          SDLC_AGENT_MODES: ${{ vars.SDLC_AGENT_MODES }}
          SDLC_AGENT_TOKEN: ${{ vars.SDLC_AGENT_ADAPTER == 'command' && secrets.SDLC_AGENT_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ vars.SDLC_AGENT_ADAPTER == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ vars.SDLC_AGENT_ADAPTER == 'codex' && secrets.OPENAI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/write_specs.py

name: Template check
# Validates the SDLC scaffold itself (always on): JSON/YAML parse, shell syntax,
# skill/agent/command frontmatter, hook wiring, runbook references, detector unit tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'PyYAML==6.0.3'
      - name: Scaffold, adapter contracts, hook regressions and detector tests
        run: make template-check
      - name: Validate GitHub Actions workflows
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.9 -color
